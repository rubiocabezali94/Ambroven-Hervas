

services:
  postgres:
    image: postgres:16-alpine
    container_name: ambroven_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambroven_dev
      POSTGRES_USER: ambroven
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambroven -d ambroven_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ambroven_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: rubiocabezali94@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data: